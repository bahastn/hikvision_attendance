# =====================================================================
#  Hikvision Attendance - configuration
#
#  Secrets are NOT stored in this file. Provide them as environment
#  variables, or in config/secrets.properties next to where the app is
#  started (that file is git-ignored; see config/secrets.properties.example):
#
#    DB_PASSWORD                 database password            (required)
#    APP_ENCRYPTION_KEY          Base64 32-byte key used to encrypt camera passwords
#    BOOTSTRAP_ADMIN_PASSWORD    password of the first admin (only used when no user exists)
#
#  Development extras (template reload, debug logs): run with profile "dev"
#  (SPRING_PROFILES_ACTIVE=dev), see application-dev.properties.
# =====================================================================
spring.config.import=optional:file:./config/secrets.properties

# Time zone
# Pinned in HikvisionAttendanceApplication.main() BEFORE Spring starts, so camera event
# times (reported with an offset, e.g. ...T14:59:14+03:00) render in local wall-clock time
# instead of the JVM default (which may be UTC). Override with the APP_TIMEZONE env var or
# -Dapp.timezone=... Default: Asia/Baghdad (+03:00). This is read in main(), NOT from here.
# APP_TIMEZONE=Asia/Baghdad

# Server
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Session cookie: HttpOnly, SameSite and 30 minutes idle timeout.
# Set SESSION_COOKIE_SECURE=true as soon as the app is served over HTTPS.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attendance}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:attendance}
spring.datasource.password=${DB_PASSWORD:ATND@Parl##2007}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "update" creates the new security tables automatically. For production, move to
# Flyway/Liquibase migrations and set JPA_DDL_AUTO=validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# File uploads (employee face photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf (template cache is turned off in the dev profile)
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# ---------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------
# First super admin, created only when the user table is empty.
# Empty password = a random one is generated and printed once in the log.
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# AES-256 key (Base64 of 32 random bytes) for camera passwords stored in the database.
# Generate one with:  openssl rand -base64 32   (keep a backup: without it stored camera passwords cannot be read)
app.security.encryption-key=${APP_ENCRYPTION_KEY:}

# Sign-in protection
app.security.login.max-failed-attempts=5
app.security.login.lock-minutes=15
app.security.password.min-length=10

# Security audit log (sign-ins, user / role / password changes)
app.security.audit-retention-days=365

# Extra origins allowed to open the live-update WebSocket (comma separated). Empty = same origin only.
app.security.websocket-allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:}

# Content-Security-Policy sent with every page. Inline scripts are still allowed because the
# templates use them; remote scripts are limited to cdnjs. Camera pictures may come from camera IPs.
app.security.content-security-policy=default-src 'self'; \
  script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; \
  style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; \
  font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; \
  img-src 'self' data: blob: http: https:; \
  connect-src 'self'; \
  frame-ancestors 'self'; \
  form-action 'self'; \
  base-uri 'self'; \
  object-src 'none'

# ---------------------------------------------------------------------
# Attendance settings
# ---------------------------------------------------------------------
attendance.sync.interval=2000
attendance.deduplication.seconds=60
attendance.similarity.threshold=80
attendance.work-start-time=08:00
attendance.work-end-time=17:00

# Camera event polling (ISAPI)
attendance.camera.poll-interval=2000
attendance.initial-lookback-minutes=5
attendance.face-storage-dir=faces
# Supporting documents attached to leave requests (images/PDF).
attendance.leave-storage-dir=leave-attachments

# Camera face-library sync (enrolled people). Syncs run in the background (the page polls a job).
# face-lib-max-results: max people pulled from the camera library per sync (one FDSearch page).
# sync-download-photos: download each new person's photo from the camera during sync. This is the
#   slow part of a large sync (one authenticated download per person), so it is OFF by default.
attendance.camera.face-lib-max-results=5000
attendance.camera.sync-download-photos=false

# Face-comparison polling (FCSearch) - how camera matches reach the dashboard on this firmware.
# The progress cursor is persisted per camera (camera_configs.last_match_time), so a restart or
# outage resumes from the last match instead of "now". The client pages through every result in
# the window (no match is dropped on busy cameras).
attendance.camera.fcsearch-enabled=true
attendance.camera.fcsearch-interval-ms=5000
attendance.camera.fcsearch-overlap-seconds=10
# Max matches pulled from one camera per poll (across all pages).
attendance.camera.fcsearch-max-results=2000
# Never look further back than this when catching up after an outage / on first run.
attendance.camera.fcsearch-max-catchup-hours=72
# How far back the very first poll of a new camera looks (no cursor yet).
attendance.camera.fcsearch-first-run-lookback-minutes=60

# ---------------------------------------------------------------------
# Central-server sync (lightweight match push - NO images)
# ---------------------------------------------------------------------
# Every recorded match is pushed to a central server as a small JSON record:
#   employeeId, personName, cameraId, cameraName, date, time, timestamp, similarity.
# Outbox pattern: matches are stored locally first, then this sender posts pending/failed rows
# on a schedule and retries until accepted, so nothing is lost if the server is briefly down.
# Disabled until a URL is configured.
attendance.central-sync.enabled=${CENTRAL_SYNC_ENABLED:false}
attendance.central-sync.url=${CENTRAL_SYNC_URL:}
# Optional auth header sent with each request, e.g. Authorization / X-API-Key and its value.
attendance.central-sync.auth-header=${CENTRAL_SYNC_AUTH_HEADER:}
attendance.central-sync.auth-token=${CENTRAL_SYNC_AUTH_TOKEN:}
attendance.central-sync.interval-ms=15000
attendance.central-sync.batch-size=200
attendance.central-sync.max-attempts=20
attendance.central-sync.request-timeout-seconds=20

# Face capture library - every captured face is kept this long, then auto-deleted
attendance.face-capture.retention-hours=24
attendance.face-capture.cleanup-interval-ms=1800000

# ---------------------------------------------------------------------
# InsightFace - secondary (fallback) face recognition
# ---------------------------------------------------------------------
# When the camera does NOT recognize a captured face, the picture is sent to a local
# InsightFace sidecar (a small Python/FastAPI service, see the insightface-service/ folder)
# which returns a face embedding. The app compares it to enrolled employees and, based on
# cosine similarity, either records attendance (high), queues the capture for human review
# (uncertain) or leaves it as an unknown capture (no match).
# Disabled by default: with enabled=false the app behaves exactly as before and makes no
# network calls to the sidecar.
insightface.enabled=${INSIGHTFACE_ENABLED:false}
insightface.base-url=${INSIGHTFACE_BASE_URL:http://127.0.0.1:8099}
insightface.model=${INSIGHTFACE_MODEL:buffalo_l}
insightface.timeout-ms=${INSIGHTFACE_TIMEOUT_MS:4000}
# Cosine-similarity bands (0..1). >= high => auto-record; [low, high) => human review; < low => no match.
# These are starting points for buffalo_l and should be tuned on your real enrolled photos.
insightface.high-threshold=${INSIGHTFACE_HIGH_THRESHOLD:0.60}
insightface.low-threshold=${INSIGHTFACE_LOW_THRESHOLD:0.40}
# Ignore faces the detector is not confident are faces at all (bad crops).
insightface.min-det-score=${INSIGHTFACE_MIN_DET_SCORE:0.50}
# Re-embed every enrolled employee that has a photo but no (or an outdated) embedding at startup.
insightface.backfill-on-startup=${INSIGHTFACE_BACKFILL_ON_STARTUP:false}
# How often to probe the sidecar /health so per-event calls don't repeatedly time out when it is down.
insightface.health-check-interval-ms=${INSIGHTFACE_HEALTH_INTERVAL_MS:30000}

# Attendance sync from camera (FCSearch) - downloads all attendance records from camera
attendance.sync.auto-enabled=true
attendance.sync.auto-interval-minutes=30
attendance.sync.lookback-days=7
attendance.sync.nightly-cron=0 0 2 * * ?
attendance.sync.quick-interval-ms=1800000

# Logging (INFO in production: DEBUG logs contain names and camera payloads)
logging.level.com.attendance=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
