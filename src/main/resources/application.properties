spring.datasource.url=jdbc:postgresql://localhost:5432/hik-db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=kar
spring.datasource.password=Kar@2025
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# H2 Console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Hikvision Camera Configuration
hikvision.camera.ip=192.168.1.64
hikvision.camera.port=80
hikvision.camera.username=admin
hikvision.camera.password=Parl@1992##19
hikvision.camera.protocol=http
hikvision.camera.sdk-port=8000
hikvision.camera.websocket-port=7681

# Attendance Settings
attendance.sync.interval=2000
attendance.deduplication.seconds=60
attendance.similarity.threshold=80
attendance.work-start-time=08:00
attendance.work-end-time=17:00

# Camera event polling (ISAPI)
attendance.camera.poll-interval=2000
attendance.initial-lookback-minutes=5
attendance.face-storage-dir=faces

# Logging
logging.level.com.attendance=DEBUG
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
