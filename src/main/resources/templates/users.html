<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::sidebar})}">
<head><title th:text="#{page.users}">Users</title></head>
<body>
<div th:fragment="sidebar">
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fas fa-user-shield icon-spacing"></i><span th:text="#{users.title}">Users</span></span>
            <button class="btn btn-primary" id="btn-add-user" th:if="${@perm.can('USER_MANAGEMENT','MODIFY')}">
                <i class="fas fa-plus"></i> <span th:text="#{users.add}">Add User</span>
            </button>
        </div>
        <div class="card-body">
            <div class="search-bar">
                <input type="text" class="form-control" id="user-search" th:placeholder="#{users.search}" style="width:300px;">
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th th:text="#{users.username}">Username</th>
                        <th th:text="#{users.fullName}">Full name</th>
                        <th th:text="#{users.roles}">Roles</th>
                        <th th:text="#{table.status}">Status</th>
                        <th th:text="#{users.lastLogin}">Last sign-in</th>
                        <th th:text="#{table.actions}">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="users-table-body">
                    <tr><td colspan="6" style="text-align:center;color:var(--hk-text-muted);padding:30px;" th:text="#{groups.loading}">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card" style="margin-top:20px;">
        <div class="card-header">
            <span class="card-title"><i class="fas fa-history icon-spacing"></i><span th:text="#{audit.title}">Security audit log</span></span>
            <button class="btn btn-sm btn-secondary" id="btn-refresh-audit"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div class="card-body">
            <div style="overflow-x:auto;max-height:420px;overflow-y:auto;">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th th:text="#{audit.time}">Time</th>
                        <th th:text="#{audit.actor}">By</th>
                        <th th:text="#{audit.action}">Action</th>
                        <th th:text="#{audit.target}">Target</th>
                        <th th:text="#{audit.details}">Details</th>
                        <th th:text="#{audit.ip}">IP</th>
                    </tr>
                    </thead>
                    <tbody id="audit-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- User modal -->
    <div class="modal-overlay" id="user-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="user-modal-title" th:text="#{users.add}">Add User</h3>
                <button class="modal-close" onclick="app.closeModal('user-modal')">&times;</button>
            </div>
            <form id="user-form" autocomplete="off">
                <div class="modal-body">
                    <input type="hidden" id="user-id">
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" for="user-username" th:text="#{users.username} + ' *'">Username *</label>
                                <input type="text" class="form-control" id="user-username" required pattern="[A-Za-z0-9._\-]{3,60}" autocomplete="off">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" for="user-fullname" th:text="#{users.fullName}">Full name</label>
                                <input type="text" class="form-control" id="user-fullname" maxlength="120">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" for="user-email" th:text="#{users.email}">Email</label>
                                <input type="email" class="form-control" id="user-email" maxlength="150">
                            </div>
                        </div>
                        <div class="col-6" id="user-password-group">
                            <div class="form-group">
                                <label class="form-label" for="user-password" th:text="#{users.tempPassword} + ' *'">Temporary password *</label>
                                <input type="password" class="form-control" id="user-password" autocomplete="new-password">
                                <small style="color:var(--hk-text-muted);font-size:11px;" th:text="#{users.tempPasswordHint}">The user must change it at first sign-in.</small>
                            </div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:8px;">
                            <input type="checkbox" id="user-enabled" checked>
                            <span th:text="#{users.enabled}">Account enabled</span>
                        </label>
                        <label style="display:flex;align-items:center;gap:8px;" th:if="${@perm.isSuperAdmin()}">
                            <input type="checkbox" id="user-superadmin">
                            <span th:text="#{users.superAdmin}">Super admin (full access to everything)</span>
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label" th:text="#{users.roles}">Roles</label>
                        <div id="user-roles-list" class="camera-check-list" style="max-height:220px;overflow-y:auto;"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="app.closeModal('user-modal')" th:text="#{groups.form.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{groups.form.save}">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reset password modal -->
    <div class="modal-overlay" id="reset-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 th:text="#{users.resetPassword}">Reset password</h3>
                <button class="modal-close" onclick="app.closeModal('reset-modal')">&times;</button>
            </div>
            <form id="reset-form" autocomplete="off">
                <div class="modal-body">
                    <input type="hidden" id="reset-user-id">
                    <p id="reset-user-name" style="margin-top:0;font-weight:600;"></p>
                    <div class="form-group">
                        <label class="form-label" for="reset-password" th:text="#{users.tempPassword}">Temporary password</label>
                        <input type="password" class="form-control" id="reset-password" required autocomplete="new-password">
                        <small style="color:var(--hk-text-muted);font-size:11px;" th:text="#{users.resetHint}">The user is signed out everywhere and must choose a new password at next sign-in.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="app.closeModal('reset-modal')" th:text="#{groups.form.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{users.resetPassword}">Reset password</button>
                </div>
            </form>
        </div>
    </div>

    <th:block th:replace="~{fragments/security-i18n :: i18n}"></th:block>
    <script th:src="@{/js/security-admin.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () { SecurityAdmin.initUsersPage(); });
    </script>
</div>
</body>
</html>
