<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:dir="${#locale.language == 'ku' ? 'rtl' : 'ltr'}"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' | ' + #{app.title}">Login</title>
    <link rel="stylesheet" th:href="@{/css/hikvision-theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
        }

        .login-logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-logo img {
            height: 56px;
        }

        .login-logo h2 {
            margin: 12px 0 4px;
            font-size: 20px;
        }

        .login-logo p {
            margin: 0;
            font-size: 13px;
            color: var(--hk-text-muted);
        }

        .login-card form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
        }

        .login-alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
        }

        .login-alert.error {
            background: rgba(220, 53, 69, 0.12);
            color: var(--hk-accent);
        }

        .login-alert.info {
            background: rgba(23, 162, 184, 0.12);
            color: var(--hk-info);
        }
    </style>
</head>
<body>
<div class="card login-card">
    <div class="card-body">
        <div class="login-logo">
            <img src="/images/logo.png" alt="Logo">
            <h2 th:text="#{app.name}">Kurdistan Parliament</h2>
            <p th:text="#{login.subtitle}">Attendance Management System</p>
        </div>

        <div class="login-alert error" th:if="${param.error}" th:text="#{login.error}">
            Invalid username or password
        </div>
        <div class="login-alert info" th:if="${param.logout}" th:text="#{login.loggedOut}">
            You have been logged out
        </div>

        <form th:action="@{/login}" method="post">
            <input type="text" name="username" class="form-control" required autofocus
                   th:placeholder="#{login.username}" placeholder="Username">
            <input type="password" name="password" class="form-control" required
                   th:placeholder="#{login.password}" placeholder="Password">
            <button type="submit" class="btn btn-primary" style="width:100%;">
                <i class="fas fa-sign-in-alt"></i>
                <span th:text="#{login.signIn}">Sign In</span>
            </button>
        </form>
    </div>
</div>
</body>
</html>
