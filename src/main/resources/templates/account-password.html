<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::sidebar})}">
<head><title th:text="#{page.changePassword}">Change Password</title></head>
<body>
<div th:fragment="sidebar">
    <div class="card" style="max-width:520px;">
        <div class="card-header">
            <span class="card-title"><i class="fas fa-key icon-spacing"></i><span th:text="#{account.password.change}">Change password</span></span>
        </div>
        <div class="card-body">
            <div class="alert alert-error show" th:if="${mustChangePassword}" style="position:static;margin-bottom:16px;"
                 th:text="#{account.password.mustChange}">You must choose a new password before you can continue.</div>

            <form id="password-form" autocomplete="off">
                <div class="form-group">
                    <label class="form-label" for="pw-current" th:text="#{account.password.current}">Current password</label>
                    <input type="password" class="form-control" id="pw-current" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label class="form-label" for="pw-new" th:text="#{account.password.new}">New password</label>
                    <input type="password" class="form-control" id="pw-new" required autocomplete="new-password"
                           th:attr="minlength=${passwordMinLength}">
                    <small style="color:var(--hk-text-muted);font-size:11px;"
                           th:text="#{account.password.rules(${passwordMinLength})}">At least 10 characters, with letters and digits.</small>
                </div>
                <div class="form-group">
                    <label class="form-label" for="pw-confirm" th:text="#{account.password.confirm}">Repeat new password</label>
                    <input type="password" class="form-control" id="pw-confirm" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> <span th:text="#{account.password.save}">Change password</span>
                </button>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        window.accountI18n = {
            mismatch: /*[[#{account.password.mismatch}]]*/ 'The new passwords do not match',
            changed: /*[[#{account.password.changed}]]*/ 'Password changed',
            failed: /*[[#{employees.operationFailed}]]*/ 'Operation failed'
        };
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('password-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const current = document.getElementById('pw-current').value;
                const next = document.getElementById('pw-new').value;
                if (next !== document.getElementById('pw-confirm').value) {
                    app.showToast(window.accountI18n.mismatch, 'error');
                    return;
                }
                try {
                    const response = await fetch('/api/account/password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ currentPassword: current, newPassword: next })
                    });
                    const body = await response.json();
                    if (body.success) {
                        app.showToast(window.accountI18n.changed, 'success');
                        setTimeout(function () { window.location.href = '/'; }, 800);
                    } else {
                        app.showToast(body.message || window.accountI18n.failed, 'error');
                    }
                } catch (err) {
                    app.showToast(window.accountI18n.failed, 'error');
                }
            });
        });
    </script>
</div>
</body>
</html>
