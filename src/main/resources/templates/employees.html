<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content})}">
<head><title th:text="#{page.employees}">Employees</title></head>
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <span class="card-title"><i class="fas fa-users icon-spacing"></i><span th:text="#{employees.title}">Employee Management</span></span>
            <button class="btn btn-primary" id="btn-add-employee">
                <i class="fas fa-plus"></i> <span th:text="#{employees.addEmployee}">Add Employee</span>
            </button>
        </div>
        <div class="card-body">
            <div class="search-bar">
                <input type="text" class="form-control" th:placeholder="#{employees.searchPlaceholder}" style="width:300px;">
            </div>
            <div style="overflow-x:auto;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th th:text="#{table.id}">ID</th>
                            <th th:text="#{table.name}">Name</th>
                            <th th:text="#{table.department}">Department</th>
                            <th th:text="#{table.position}">Position</th>
                            <th th:text="#{table.email}">Email</th>
                            <th th:text="#{table.status}">Status</th>
                            <th th:text="#{table.actions}">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employees-table-body">
                        <tr><td colspan="7" style="text-align:center;color:var(--hk-text-muted);padding:30px;" th:text="#{employees.loading}">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="employee-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title" th:text="#{employees.modal.add}">Add Employee</h3>
                <button class="modal-close" onclick="app.closeModal('employee-modal')">&times;</button>
            </div>
            <form id="employee-form">
                <div class="modal-body">
                    <input type="hidden" id="employee-id-hidden">
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" th:text="#{employees.form.employeeId}">Employee ID *</label>
                                <input type="text" class="form-control" id="emp-id" required>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" th:text="#{employees.form.fullName}">Full Name *</label>
                                <input type="text" class="form-control" id="emp-name" required>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" th:text="#{employees.form.department}">Department</label>
                                <input type="text" class="form-control" id="emp-dept">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" th:text="#{employees.form.position}">Position</label>
                                <input type="text" class="form-control" id="emp-position">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" th:text="#{employees.form.email}">Email</label>
                                <input type="email" class="form-control" id="emp-email">
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="form-group">
                                <label class="form-label" th:text="#{employees.form.phone}">Phone</label>
                                <input type="text" class="form-control" id="emp-phone">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="app.closeModal('employee-modal')" th:text="#{employees.form.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary" th:text="#{employees.form.save}">Save</button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
