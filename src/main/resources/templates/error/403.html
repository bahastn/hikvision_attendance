<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:dir="${#locale.language == 'ku' ? 'rtl' : 'ltr'}"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.403.title}">Access denied</title>
    <link rel="stylesheet" th:href="@{/css/hikvision-theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .denied-card { max-width: 440px; width: 100%; text-align: center; }
        .denied-card i { font-size: 42px; color: var(--hk-accent); margin-bottom: 12px; }
        .denied-card h2 { margin: 0 0 8px; font-size: 20px; }
        .denied-card p { margin: 0 0 18px; color: var(--hk-text-muted); font-size: 14px; }
    </style>
</head>
<body>
<div class="card denied-card">
    <div class="card-body">
        <i class="fas fa-lock"></i>
        <h2 th:text="#{error.403.title}">Access denied</h2>
        <p th:text="#{error.403.message}">You do not have permission to open this page. Ask an administrator if you need access.</p>
        <a th:href="@{/}" class="btn btn-primary">
            <i class="fas fa-home"></i> <span th:text="#{error.403.back}">Back to dashboard</span>
        </a>
    </div>
</div>
</body>
</html>
