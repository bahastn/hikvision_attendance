<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::sidebar})}">
<head>
    <title th:text="#{page.faceMatches}">Face Matches</title>
    <style>
        .match-card {
            border: 1px solid var(--hk-border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: white;
            transition: box-shadow 0.2s;
        }
        .match-card:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .match-card.selected {
            border-color: var(--hk-primary);
            background: #f0f7ff;
        }
        .match-photo {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
        }
        .similarity-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }
        .similarity-high { background: #d4edda; color: #155724; }
        .similarity-medium { background: #fff3cd; color: #856404; }
        .similarity-low { background: #f8d7da; color: #721c24; }
        .status-badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            text-transform: uppercase;
        }
        .status-new { background: #cce5ff; color: #004085; }
        .status-processed { background: #d4edda; color: #155724; }
        .status-ignored { background: #e2e3e5; color: #383d41; }
        .filter-panel {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .bulk-actions {
            background: #e9ecef;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }
        .bulk-actions.visible {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .photo-modal img {
            max-width: 100%;
            max-height: 70vh;
        }
    </style>
</head>
<body>
<div th:fragment="sidebar">
    <div class="card">
        <div class="card-header">
            <span class="card-title">
                <i class="fas fa-user-check icon-spacing"></i>
                <span th:text="#{faceMatches.title}">Face Matches</span>
            </span>
            <div style="display:flex;gap:10px;align-items:center;">
                <button class="btn btn-secondary" id="btn-refresh">
                    <i class="fas fa-sync-alt"></i> <span th:text="#{common.refresh}">Refresh</span>
                </button>
                <button class="btn btn-primary" id="btn-download">
                    <i class="fas fa-download"></i> <span th:text="#{faceMatches.download}">Download</span>
                </button>
            </div>
        </div>
        <div class="card-body">
            <!-- Filter Panel -->
            <div class="filter-panel">
                <div class="row">
                    <div class="col-3">
                        <label class="form-label" th:text="#{faceMatches.filterCamera}">Camera</label>
                        <select class="form-control" id="filter-camera">
                            <option value="" th:text="#{common.all}">All</option>
                        </select>
                    </div>
                    <div class="col-3">
                        <label class="form-label" th:text="#{faceMatches.filterStatus}">Status</label>
                        <select class="form-control" id="filter-status">
                            <option value="" th:text="#{common.all}">All</option>
                            <option value="NEW" th:text="#{faceMatches.statusNew}">New</option>
                            <option value="PROCESSED" th:text="#{faceMatches.statusProcessed}">Processed</option>
                            <option value="IGNORED" th:text="#{faceMatches.statusIgnored}">Ignored</option>
                        </select>
                    </div>
                    <div class="col-3">
                        <label class="form-label" th:text="#{faceMatches.filterDateFrom}">From</label>
                        <input type="datetime-local" class="form-control" id="filter-date-from">
                    </div>
                    <div class="col-3">
                        <label class="form-label" th:text="#{faceMatches.filterDateTo}">To</label>
                        <input type="datetime-local" class="form-control" id="filter-date-to">
                    </div>
                </div>
                <div class="row" style="margin-top:10px;">
                    <div class="col-3">
                        <label class="form-label" th:text="#{faceMatches.minSimilarity}">Min Similarity %</label>
                        <input type="number" class="form-control" id="filter-similarity" value="0" min="0" max="100">
                    </div>
                    <div class="col-6">
                        <label class="form-label" th:text="#{faceMatches.filterSearch}">Employee name or ID</label>
                        <input type="text" class="form-control" id="filter-search"
                               th:placeholder="#{faceMatches.filterSearchPlaceholder}" placeholder="Search by name or ID...">
                    </div>
                    <div class="col-3" style="display:flex;align-items:flex-end;gap:10px;">
                        <button class="btn btn-primary" id="btn-apply-filters">
                            <i class="fas fa-filter"></i> <span th:text="#{common.apply}">Apply</span>
                        </button>
                        <button class="btn btn-secondary" id="btn-clear-filters">
                            <i class="fas fa-times"></i> <span th:text="#{common.clear}">Clear</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Bulk Actions -->
            <div class="bulk-actions" id="bulk-actions">
                <span id="selected-count">0 selected</span>
                <button class="btn btn-success" id="btn-bulk-import">
                    <i class="fas fa-user-plus"></i> <span th:text="#{faceMatches.importSelected}">Import Selected</span>
                </button>
                <button class="btn btn-info" id="btn-bulk-link">
                    <i class="fas fa-link"></i> <span th:text="#{faceMatches.linkSelected}">Link Selected</span>
                </button>
                <button class="btn btn-warning" id="btn-bulk-ignore">
                    <i class="fas fa-eye-slash"></i> <span th:text="#{faceMatches.ignoreSelected}">Ignore Selected</span>
                </button>
                <button class="btn btn-secondary" id="btn-clear-selection">
                    <i class="fas fa-times"></i> <span th:text="#{common.clearSelection}">Clear Selection</span>
                </button>
            </div>

            <!-- Matches List -->
            <div id="matches-container">
                <div style="text-align:center;padding:40px;color:var(--hk-text-muted);">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p th:text="#{common.loading}">Loading...</p>
                </div>
            </div>

            <!-- Pagination -->
            <div id="pagination" style="margin-top:20px;display:flex;justify-content:center;gap:10px;">
                <!-- Pagination buttons will be inserted here -->
            </div>
        </div>
    </div>

    <!-- Photo Preview Modal -->
    <div class="modal-overlay" id="photo-modal">
        <div class="modal photo-modal" style="max-width:800px;">
            <div class="modal-header">
                <h3 th:text="#{faceMatches.photoPreview}">Photo Preview</h3>
                <button class="modal-close" onclick="app.closeModal('photo-modal')">&times;</button>
            </div>
            <div class="modal-body" style="text-align:center;">
                <img id="preview-photo" src="" alt="Face match photo">
                <div id="photo-details" style="margin-top:15px;text-align:left;">
                    <!-- Photo details will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Link to Employee Modal -->
    <div class="modal-overlay" id="link-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 th:text="#{faceMatches.linkToEmployee}">Link to Employee</h3>
                <button class="modal-close" onclick="app.closeModal('link-modal')">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="link-match-id">
                <div class="form-group">
                    <label class="form-label" th:text="#{faceMatches.selectEmployee}">Select Employee</label>
                    <select class="form-control" id="link-employee-select">
                        <option value="" th:text="#{common.select}">Select...</option>
                    </select>
                </div>
                <div id="link-match-details" style="margin-top:15px;padding:10px;background:#f8f9fa;border-radius:4px;">
                    <!-- Match details will be shown here -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="app.closeModal('link-modal')" th:text="#{common.cancel}">Cancel</button>
                <button class="btn btn-primary" id="btn-confirm-link" th:text="#{common.confirm}">Confirm</button>
            </div>
        </div>
    </div>

<script>
    // Face Matches Page JavaScript
    let currentPage = 0;
    let totalPages = 1;
    const PAGE_SIZE = 60;
    let selectedMatches = new Set();
    let allMatches = [];

    document.addEventListener('DOMContentLoaded', function() {
        loadCameras();
        loadMatches();
        setupEventListeners();
    });

    function setupEventListeners() {
        document.getElementById('btn-refresh').addEventListener('click', () => loadMatches(0));
        document.getElementById('btn-apply-filters').addEventListener('click', () => loadMatches(0));
        document.getElementById('btn-clear-filters').addEventListener('click', clearFilters);
        // Live search: reload (page 0) a short moment after the user stops typing.
        let searchTimer = null;
        document.getElementById('filter-search').addEventListener('input', function() {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => loadMatches(0), 350);
        });
        document.getElementById('btn-download').addEventListener('click', downloadMatches);
        document.getElementById('btn-clear-selection').addEventListener('click', clearSelection);
        document.getElementById('btn-bulk-import').addEventListener('click', bulkImport);
        document.getElementById('btn-bulk-link').addEventListener('click', bulkLink);
        document.getElementById('btn-bulk-ignore').addEventListener('click', bulkIgnore);
        document.getElementById('btn-confirm-link').addEventListener('click', confirmLink);
    }

    function loadCameras() {
        fetch('/api/cameras')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const select = document.getElementById('filter-camera');
                    data.data.forEach(camera => {
                        const option = document.createElement('option');
                        option.value = camera.id;
                        option.textContent = camera.cameraName;
                        select.appendChild(option);
                    });
                }
            });
    }

    function loadMatches(page) {
        currentPage = Number.isInteger(page) ? page : 0;
        const container = document.getElementById('matches-container');
        container.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
        document.getElementById('pagination').innerHTML = '';

        // Build query params
        const params = new URLSearchParams();
        const cameraId = document.getElementById('filter-camera').value;
        const status = document.getElementById('filter-status').value;
        const minSimilarity = document.getElementById('filter-similarity').value;
        const search = document.getElementById('filter-search').value;
        const from = document.getElementById('filter-date-from').value;
        const to = document.getElementById('filter-date-to').value;

        if (cameraId) params.append('cameraId', cameraId);
        if (status) params.append('status', status);
        if (minSimilarity) params.append('minSimilarity', minSimilarity);
        if (search && search.trim()) params.append('query', search.trim());
        if (from) params.append('from', from + ':00');
        if (to) params.append('to', to + ':00');
        params.append('page', currentPage);
        params.append('size', PAGE_SIZE);

        fetch('/api/face-matches?' + params.toString())
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    allMatches = data.data.content || [];
                    totalPages = data.data.totalPages || 1;
                    renderMatches(allMatches, data.data.totalElements || 0);
                    renderPagination();
                } else {
                    container.innerHTML = '<div class="alert alert-danger">Error loading matches: ' + (data.message || '') + '</div>';
                }
            })
            .catch(error => {
                container.innerHTML = '<div class="alert alert-danger">Error: ' + error.message + '</div>';
            });
    }

    function renderPagination() {
        const pager = document.getElementById('pagination');
        if (totalPages <= 1) { pager.innerHTML = ''; return; }
        let html = '';
        html += `<button class="btn btn-secondary" ${currentPage <= 0 ? 'disabled' : ''} onclick="loadMatches(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
        html += `<span style="align-self:center;">Page ${currentPage + 1} / ${totalPages}</span>`;
        html += `<button class="btn btn-secondary" ${currentPage >= totalPages - 1 ? 'disabled' : ''} onclick="loadMatches(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
        pager.innerHTML = html;
    }

    function renderMatches(matches, totalElements) {
        const container = document.getElementById('matches-container');

        if (matches.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--hk-text-muted);">No matches found</div>';
            return;
        }

        let html = '';
        if (typeof totalElements === 'number') {
            html += `<div style="margin-bottom:10px;color:var(--hk-text-muted);font-size:13px;">${totalElements} match${totalElements === 1 ? '' : 'es'}</div>`;
        }
        matches.forEach(match => {
            const similarityClass = match.similarity >= 90 ? 'similarity-high' :
                                   match.similarity >= 80 ? 'similarity-medium' : 'similarity-low';
            const statusClass = 'status-' + match.status.toLowerCase();
            const photoUrl = '/api/face-matches/' + match.id + '/photo';

            html += `
                <div class="match-card ${selectedMatches.has(match.id) ? 'selected' : ''}" data-id="${match.id}">
                    <div style="display:flex;gap:15px;align-items:flex-start;">
                        <input type="checkbox" class="match-checkbox" data-id="${match.id}"
                               ${selectedMatches.has(match.id) ? 'checked' : ''}
                               style="margin-top:5px;">
                        <img class="match-photo" src="${photoUrl}" loading="lazy"
                             onclick="showPhoto('${photoUrl}', '${(match.personName || '').replace(/'/g, '')}', ${match.similarity})"
                             onerror="this.onerror=null;this.src='/images/no-photo.png'">
                        <div style="flex:1;">
                            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
                                <div>
                                    <h4 style="margin:0 0 5px 0;">${match.personName || 'Unknown'}</h4>
                                    <p style="margin:0;color:var(--hk-text-muted);font-size:13px;">
                                        ID: ${match.certificateNumber || 'N/A'} | 
                                        Camera: ${match.cameraName || 'Unknown'} |
                                        PID: ${match.cameraPid || 'N/A'}
                                    </p>
                                </div>
                                <div style="text-align:right;">
                                    <span class="similarity-badge ${similarityClass}">${match.similarity ? match.similarity.toFixed(1) + '%' : 'N/A'}</span>
                                    <span class="status-badge ${statusClass}" style="margin-left:5px;">${match.status}</span>
                                </div>
                            </div>
                            <div style="margin-top:10px;font-size:12px;color:var(--hk-text-muted);">
                                <i class="fas fa-clock"></i> ${formatDateTime(match.matchTime)}
                            </div>
                            <div style="margin-top:10px;display:flex;gap:5px;">
                                <button class="btn btn-sm btn-success" onclick="importMatch(${match.id})">
                                    <i class="fas fa-user-plus"></i> Import
                                </button>
                                <button class="btn btn-sm btn-info" onclick="showLinkModal(${match.id})">
                                    <i class="fas fa-link"></i> Link
                                </button>
                                <button class="btn btn-sm btn-warning" onclick="ignoreMatch(${match.id})">
                                    <i class="fas fa-eye-slash"></i> Ignore
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
        
        container.innerHTML = html;
        
        // Add checkbox listeners
        document.querySelectorAll('.match-checkbox').forEach(cb => {
            cb.addEventListener('change', function() {
                const id = parseInt(this.dataset.id);
                if (this.checked) {
                    selectedMatches.add(id);
                } else {
                    selectedMatches.delete(id);
                }
                updateBulkActions();
            });
        });
    }

    function updateBulkActions() {
        const bulkActions = document.getElementById('bulk-actions');
        const count = document.getElementById('selected-count');
        
        if (selectedMatches.size > 0) {
            bulkActions.classList.add('visible');
            count.textContent = selectedMatches.size + ' selected';
        } else {
            bulkActions.classList.remove('visible');
        }
    }

    function clearSelection() {
        selectedMatches.clear();
        document.querySelectorAll('.match-checkbox').forEach(cb => cb.checked = false);
        updateBulkActions();
        renderMatches(allMatches);
    }

    function showPhoto(url, name, similarity) {
        document.getElementById('preview-photo').src = url || '/images/no-photo.png';
        document.getElementById('photo-details').innerHTML = `
            <p><strong>Name:</strong> ${name || 'Unknown'}</p>
            <p><strong>Similarity:</strong> ${similarity ? similarity.toFixed(1) + '%' : 'N/A'}</p>
        `;
        app.openModal('photo-modal');
    }

    function showLinkModal(matchId) {
        document.getElementById('link-match-id').value = matchId;
        // Load employees for selection
        fetch('/api/employees')
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const select = document.getElementById('link-employee-select');
                    select.innerHTML = '<option value="">Select...</option>';
                    data.data.forEach(emp => {
                        const option = document.createElement('option');
                        option.value = emp.employeeId;
                        option.textContent = emp.fullName + ' (' + emp.employeeId + ')';
                        select.appendChild(option);
                    });
                }
            });
        app.openModal('link-modal');
    }

    function importMatch(matchId) {
        if (!confirm('Import this person as a new employee?')) return;
        
        fetch('/api/face-matches/sync-to-database', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                matchIds: [matchId],
                action: 'IMPORT',
                performedBy: 'user'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Import successful');
                loadMatches();
            } else {
                alert('Import failed: ' + data.message);
            }
        });
    }

    function ignoreMatch(matchId) {
        fetch('/api/face-matches/sync-to-database', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                matchIds: [matchId],
                action: 'IGNORE',
                performedBy: 'user'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                loadMatches();
            }
        });
    }

    function confirmLink() {
        const matchId = document.getElementById('link-match-id').value;
        const employeeId = document.getElementById('link-employee-select').value;
        
        if (!employeeId) {
            alert('Please select an employee');
            return;
        }

        fetch('/api/face-matches/sync-to-database', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                matchIds: [parseInt(matchId)],
                action: 'LINK',
                performedBy: 'user',
                employeeIdMapping: {[matchId]: employeeId}
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                app.closeModal('link-modal');
                loadMatches();
            } else {
                alert('Link failed: ' + data.message);
            }
        });
    }

    function bulkImport() {
        if (!confirm('Import ' + selectedMatches.size + ' selected matches as new employees?')) return;
        
        fetch('/api/face-matches/sync-to-database', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                matchIds: Array.from(selectedMatches),
                action: 'IMPORT',
                performedBy: 'user'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert('Bulk import completed');
                clearSelection();
                loadMatches();
            } else {
                alert('Import failed: ' + data.message);
            }
        });
    }

    function bulkLink() {
        alert('Bulk link - select target employee for each match');
        // Implementation would show a mapping interface
    }

    function bulkIgnore() {
        if (!confirm('Ignore ' + selectedMatches.size + ' selected matches?')) return;
        
        fetch('/api/face-matches/sync-to-database', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                matchIds: Array.from(selectedMatches),
                action: 'IGNORE',
                performedBy: 'user'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                clearSelection();
                loadMatches();
            }
        });
    }

    function downloadMatches() {
        const start = document.getElementById('filter-date-from').value || 
                     new Date(Date.now() - 7*24*60*60*1000).toISOString().slice(0,16);
        const end = document.getElementById('filter-date-to').value || 
                   new Date().toISOString().slice(0,16);
        
        const params = new URLSearchParams({
            start: start + ':00',
            end: end + ':00',
            format: 'csv'
        });
        
        const cameraId = document.getElementById('filter-camera').value;
        if (cameraId) params.append('cameraId', cameraId);
        
        window.location.href = '/api/face-matches/download?' + params.toString();
    }

    function clearFilters() {
        document.getElementById('filter-camera').value = '';
        document.getElementById('filter-status').value = '';
        document.getElementById('filter-date-from').value = '';
        document.getElementById('filter-date-to').value = '';
        document.getElementById('filter-similarity').value = '0';
        document.getElementById('filter-search').value = '';
        loadMatches(0);
    }

    function formatDateTime(dateTimeStr) {
        if (!dateTimeStr) return 'N/A';
        const date = new Date(dateTimeStr);
        return date.toLocaleString();
    }
</script>
</div>
</body>
</html>
