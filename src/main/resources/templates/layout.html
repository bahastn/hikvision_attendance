<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)"
      th:dir="${#locale.language == 'ku' ? 'rtl' : 'ltr'}"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{${pageTitleKey}} + ' | ' + #{app.title}">Kurdistan Parliament Attendance</title>
    <link rel="stylesheet" th:href="@{/css/hikvision-theme.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script th:inline="javascript">
        window.i18n = {
            connected: /*[[#{header.connected}]]*/ 'Connected',
            disconnected: /*[[#{header.disconnected}]]*/ 'Disconnected',
            detected: /*[[#{toast.detected}]]*/ 'Detected',
            cameraStatus: /*[[#{toast.cameraStatus}]]*/ 'Camera',
            checkOutSuccess: /*[[#{toast.checkOutSuccess}]]*/ 'Check-out successful',
            checkOutFailed: /*[[#{toast.checkOutFailed}]]*/ 'Check-out failed',
            noRecords: /*[[#{attendance.noRecords}]]*/ 'No records found',
            noDetections: /*[[#{dashboard.noDetections}]]*/ 'No detections yet',
            noAttendance: /*[[#{dashboard.noAttendance}]]*/ 'No attendance records yet',
            waitingDetections: /*[[#{liveView.waitingDetections}]]*/ 'Waiting for detections...',
            loading: /*[[#{attendance.loading}]]*/ 'Loading...',
            editEmployee: /*[[#{employees.modal.edit}]]*/ 'Edit Employee',
            addEmployee: /*[[#{employees.modal.add}]]*/ 'Add Employee',
            employeeCreated: /*[[#{employees.created}]]*/ 'Employee created',
            employeeUpdated: /*[[#{employees.updated}]]*/ 'Employee updated',
            employeeDeleted: /*[[#{employees.deleted}]]*/ 'Employee deleted',
            deleteFailed: /*[[#{employees.deleteFailed}]]*/ 'Delete failed',
            loadEmployeeFailed: /*[[#{employees.loadFailed}]]*/ 'Failed to load employee',
            operationFailed: /*[[#{employees.operationFailed}]]*/ 'Operation failed',
            deleteEmployeeConfirm: /*[[#{employees.deleteConfirm}]]*/ 'Are you sure?',
            editCamera: /*[[#{cameras.modal.edit}]]*/ 'Edit Camera',
            addCamera: /*[[#{cameras.modal.add}]]*/ 'Add Camera',
            cameraAdded: /*[[#{cameras.added}]]*/ 'Camera added',
            cameraUpdated: /*[[#{cameras.updated}]]*/ 'Camera updated',
            cameraDeleted: /*[[#{cameras.deleted}]]*/ 'Camera deleted',
            cameraDeleteFailed: /*[[#{cameras.deleteFailed}]]*/ 'Delete failed',
            cameraTestFailed: /*[[#{cameras.testFailed}]]*/ 'Test failed',
            loadCameraFailed: /*[[#{cameras.loadFailed}]]*/ 'Failed to load camera',
            deleteCameraConfirm: /*[[#{cameras.deleteConfirm}]]*/ 'Are you sure?',
            online: /*[[#{cameras.online}]]*/ 'Online',
            offline: /*[[#{cameras.offline}]]*/ 'Offline',
            active: /*[[#{employees.active}]]*/ 'Active',
            inactive: /*[[#{employees.inactive}]]*/ 'Inactive',
            never: /*[[#{cameras.never}]]*/ 'Never',
            statusPresent: /*[[#{status.present}]]*/ 'PRESENT',
            statusAbsent: /*[[#{status.absent}]]*/ 'ABSENT',
            statusLate: /*[[#{status.late}]]*/ 'LATE',
            statusLeave: /*[[#{status.leave}]]*/ 'LEAVE',
            statusUnknown: /*[[#{status.unknown}]]*/ 'UNKNOWN',
            noLeaves: /*[[#{leave.noLeaves}]]*/ 'No leave records found',
            noActive: /*[[#{leave.noActive}]]*/ 'No employees currently on leave',
            noPending: /*[[#{leave.noPending}]]*/ 'No pending leave requests',
            noApproved: /*[[#{leave.noApproved}]]*/ 'No approved leaves',
            leaveDays: /*[[#{leave.days}]]*/ 'days',
            leaveDay: /*[[#{leave.day}]]*/ 'day',
            leaveLastDay: /*[[#{leave.lastDay}]]*/ 'Last day',
            leaveTypeAnnual: /*[[#{leave.type.annual}]]*/ 'Annual Leave',
            leaveTypeSick: /*[[#{leave.type.sick}]]*/ 'Sick Leave',
            leaveTypeCasual: /*[[#{leave.type.casual}]]*/ 'Casual Leave',
            leaveTypeMaternity: /*[[#{leave.type.maternity}]]*/ 'Maternity Leave',
            leaveTypePaternity: /*[[#{leave.type.paternity}]]*/ 'Paternity Leave',
            leaveTypeUnpaid: /*[[#{leave.type.unpaid}]]*/ 'Unpaid Leave',
            leaveTypeOther: /*[[#{leave.type.other}]]*/ 'Other',
            leaveStatusPending: /*[[#{leave.status.pending}]]*/ 'PENDING',
            leaveStatusApproved: /*[[#{leave.status.approved}]]*/ 'APPROVED',
            leaveStatusRejected: /*[[#{leave.status.rejected}]]*/ 'REJECTED',
            leaveStatusCancelled: /*[[#{leave.status.cancelled}]]*/ 'CANCELLED',
            leaveCreated: /*[[#{leave.created}]]*/ 'Leave request created',
            leaveApproved: /*[[#{leave.approved}]]*/ 'Leave approved',
            leaveRejected: /*[[#{leave.rejected}]]*/ 'Leave rejected',
            leaveCancelled: /*[[#{leave.cancelled}]]*/ 'Leave cancelled',
            leaveDeleted: /*[[#{leave.deleted}]]*/ 'Leave deleted',
            leaveApproveConfirm: /*[[#{leave.approveConfirm}]]*/ 'Approve this leave request?',
            leaveRejectConfirm: /*[[#{leave.rejectConfirm}]]*/ 'Reject this leave request?',
            leaveDeleteConfirm: /*[[#{leave.deleteConfirm}]]*/ 'Delete this leave record?',
            noOneOnLeave: /*[[#{dashboard.noOneOnLeave}]]*/ 'No employees on leave',
            leaveDaysRemaining: /*[[#{leave.daysRemaining}]]*/ 'remaining',
            isRTL: /*[[${#locale.language == 'ku'}]]*/ false
        };
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
</head>
<body>
<div class="app-container">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img src="/images/logo.png" alt="Logo" style="height: 40px; width: auto; filter: brightness(0) invert(1);">
                <span class="logo-text" th:text="#{app.name}">Kurdistan Parliament</span>
            </div>
            <div class="version" th:text="#{app.version}">Attendance Admin v1.0</div>
        </div>
        <nav class="sidebar-nav">
            <!-- Dashboard -->
            <a href="/" class="nav-item" th:classappend="${activePage == 'dashboard'} ? 'active'">
                <i class="fas fa-tachometer-alt"></i>
                <span th:text="#{nav.dashboard}">Dashboard</span>
            </a>

            <!-- Attendance -->
            <a href="/attendance" class="nav-item" th:classappend="${activePage == 'attendance'} ? 'active'">
                <i class="fas fa-clipboard-list"></i>
                <span th:text="#{nav.attendance}">Attendance</span>
            </a>

            <!-- People Group -->
            <button class="sidebar-collapse-btn" type="button"
                    onclick="toggleSubmenu('peopleSubmenu', this)"
                    aria-expanded="false" aria-controls="peopleSubmenu">
                <span class="btn-content">
                    <i class="fas fa-users btn-icon"></i>
                    <span class="btn-text" th:text="#{nav.people}">People</span>
                </span>
                <i class="fas fa-chevron-down collapse-icon"></i>
            </button>
            <div class="collapse" id="peopleSubmenu">
                <ul class="nav flex-column sidebar-submenu">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/employees}" th:classappend="${activePage == 'employees'} ? 'active'">
                            <i class="fas fa-user"></i>
                            <span th:text="#{nav.employees}">Employees</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/groups}" th:classappend="${activePage == 'groups'} ? 'active'">
                            <i class="fas fa-layer-group"></i>
                            <span th:text="#{nav.groups}">Groups</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/leaves}" th:classappend="${activePage == 'leaves'} ? 'active'">
                            <i class="fas fa-calendar-alt"></i>
                            <span th:text="#{nav.leaves}">Leaves</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Devices Group -->
            <button class="sidebar-collapse-btn" type="button"
                    onclick="toggleSubmenu('devicesSubmenu', this)"
                    aria-expanded="false" aria-controls="devicesSubmenu">
                <span class="btn-content">
                    <i class="fas fa-camera btn-icon"></i>
                    <span class="btn-text" th:text="#{nav.devices}">Devices</span>
                </span>
                <i class="fas fa-chevron-down collapse-icon"></i>
            </button>
            <div class="collapse" id="devicesSubmenu">
                <ul class="nav flex-column sidebar-submenu">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/cameras}" th:classappend="${activePage == 'cameras'} ? 'active'">
                            <i class="fas fa-video"></i>
                            <span th:text="#{nav.cameras}">Cameras</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/live-view}" th:classappend="${activePage == 'live-view'} ? 'active'">
                            <i class="fas fa-eye"></i>
                            <span th:text="#{nav.liveView}">Live View</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Schedule Group -->
            <button class="sidebar-collapse-btn" type="button"
                    onclick="toggleSubmenu('scheduleSubmenu', this)"
                    aria-expanded="false" aria-controls="scheduleSubmenu">
                <span class="btn-content">
                    <i class="fas fa-clock btn-icon"></i>
                    <span class="btn-text" th:text="#{nav.schedule}">Schedule</span>
                </span>
                <i class="fas fa-chevron-down collapse-icon"></i>
            </button>
            <div class="collapse" id="scheduleSubmenu">
                <ul class="nav flex-column sidebar-submenu">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shifts}" th:classappend="${activePage == 'shifts'} ? 'active'">
                            <i class="fas fa-clock"></i>
                            <span th:text="#{nav.shifts}">Shifts</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shift-rules}" th:classappend="${activePage == 'shift-rules'} ? 'active'">
                            <i class="fas fa-gavel"></i>
                            <span th:text="#{nav.shiftRules}">Shift Rules</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/shift-schedule}" th:classappend="${activePage == 'shift-schedule'} ? 'active'">
                            <i class="fas fa-calendar-check"></i>
                            <span th:text="#{nav.shiftSchedule}">Shift Schedule</span>
                        </a>
                    </li>
                </ul>
            </div>

            <!-- System Group -->
            <button class="sidebar-collapse-btn" type="button"
                    onclick="toggleSubmenu('systemSubmenu', this)"
                    aria-expanded="false" aria-controls="systemSubmenu">
                <span class="btn-content">
                    <i class="fas fa-cog btn-icon"></i>
                    <span class="btn-text" th:text="#{nav.system}">System</span>
                </span>
                <i class="fas fa-chevron-down collapse-icon"></i>
            </button>
            <div class="collapse" id="systemSubmenu">
                <ul class="nav flex-column sidebar-submenu">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reports}" th:classappend="${activePage == 'reports'} ? 'active'">
                            <i class="fas fa-chart-bar"></i>
                            <span th:text="#{nav.reports}">Reports</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/settings}" th:classappend="${activePage == 'settings'} ? 'active'">
                            <i class="fas fa-cogs"></i>
                            <span th:text="#{nav.settings}">Settings</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="sidebar-footer">
            <div class="sync-indicator">
                <div class="sync-dot" id="sync-dot"></div>
                <span th:text="#{header.syncEvery}">Sync every 2s</span>
            </div>
        </div>
    </aside>
    <main class="main-content" id="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle" onclick="app.toggleSidebar()" title="Toggle Sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title" th:text="#{${pageTitleKey}}">Dashboard</h1>
            </div>
            <div class="header-actions">
                <div class="language-switcher">
                    <a th:href="@{${currentPath}(lang='en')}"
                       th:class="${#locale.language == 'en'} ? 'lang-option active' : 'lang-option'"
                       th:text="#{lang.english}">English</a>
                    <span class="lang-separator">|</span>
                    <a th:href="@{${currentPath}(lang='ku')}"
                       th:class="${#locale.language == 'ku'} ? 'lang-option active' : 'lang-option'"
                       th:text="#{lang.kurdish}">کوردی</a>
                </div>
                <div class="connection-status" id="connection-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="connection-text" th:text="#{header.connecting}">Connecting...</span>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">A</div>
                    <span th:text="#{header.admin}">Admin</span>
                    <i class="fas fa-chevron-down" style="font-size:10px;"></i>
                </div>
            </div>
        </header>
        <div class="content-area">
            <div th:replace="${content}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    // Sidebar submenu toggle
    function toggleSubmenu(menuId, btn) {
        const menu = document.getElementById(menuId);
        if (!menu) return;

        const isExpanded = btn.getAttribute('aria-expanded') === 'true';

        if (isExpanded) {
            menu.classList.remove('show');
            btn.setAttribute('aria-expanded', 'false');
            localStorage.setItem('sidebarMenu_' + menuId, 'collapsed');
        } else {
            menu.classList.add('show');
            btn.setAttribute('aria-expanded', 'true');
            localStorage.setItem('sidebarMenu_' + menuId, 'expanded');
        }
    }

    // Restore saved submenu states
    document.addEventListener('DOMContentLoaded', function () {
        const collapsibleMenus = document.querySelectorAll('.sidebar .collapse');

        collapsibleMenus.forEach(function (menu) {
            const menuId = menu.id;
            const btn = document.querySelector('[aria-controls="' + menuId + '"]');

            if (menu && btn) {
                const savedState = localStorage.getItem('sidebarMenu_' + menuId);

                if (savedState === 'expanded') {
                    menu.classList.add('show');
                    btn.setAttribute('aria-expanded', 'true');
                } else {
                    menu.classList.remove('show');
                    btn.setAttribute('aria-expanded', 'false');
                }
            }
        });
    });
</script>
</body>
</html>
