<body>
<div class="app-container">
    <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>
    <main class="main-content" id="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebar-toggle" onclick="app.toggleSidebar()" title="Toggle Sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 class="page-title" th:text="#{${pageTitleKey}}">Dashboard</h1>
            </div>
            <div class="header-actions">
                <div class="language-switcher">
                    <a th:href="@{${currentPath}(lang='en')}"
                       th:class="${#locale.language == 'en'} ? 'lang-option active' : 'lang-option'"
                       th:text="#{lang.english}">English</a>
                    <span class="lang-separator">|</span>
                    <a th:href="@{${currentPath}(lang='ku')}"
                       th:class="${#locale.language == 'ku'} ? 'lang-option active' : 'lang-option'"
                       th:text="#{lang.kurdish}">کوردی</a>
                </div>
                <div class="connection-status" id="connection-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="connection-text" th:text="#{header.connecting}">Connecting...</span>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">A</div>
                    <span th:text="#{header.admin}">Admin</span>
                    <i class="fas fa-chevron-down" style="font-size:10px;"></i>
                </div>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-sm btn-secondary">
                        <i class="fas fa-sign-out-alt"></i>
                        <span th:text="#{header.logout}">Logout</span>
                    </button>
                </form>
            </div>
        </header>
        <div class="content-area">
            <div th:replace="${sidebar}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    // Sidebar submenu toggle
    function toggleSubmenu(menuId, btn) {
        const menu = document.getElementById(menuId);
        if (!menu) return;

        const isExpanded = btn.getAttribute('aria-expanded') === 'true';

        if (isExpanded) {
            menu.classList.remove('show');
            btn.setAttribute('aria-expanded', 'false');
            localStorage.setItem('sidebarMenu_' + menuId, 'collapsed');
        } else {
            menu.classList.add('show');
            btn.setAttribute('aria-expanded', 'true');
            localStorage.setItem('sidebarMenu_' + menuId, 'expanded');
        }
    }

    // Restore saved submenu states
    document.addEventListener('DOMContentLoaded', function () {
        const collapsibleMenus = document.querySelectorAll('.sidebar .collapse');

        collapsibleMenus.forEach(function (menu) {
            const menuId = menu.id;
            const btn = document.querySelector('[aria-controls="' + menuId + '"]');

            if (menu && btn) {
                const savedState = localStorage.getItem('sidebarMenu_' + menuId);

                if (savedState === 'expanded') {
                    menu.classList.add('show');
                    btn.setAttribute('aria-expanded', 'true');
                } else {
                    menu.classList.remove('show');
                    btn.setAttribute('aria-expanded', 'false');
                }
            }
        });
    });
</script>
</body>
</html>
