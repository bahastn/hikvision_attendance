    <script>
        // Every same-origin fetch that changes data carries the CSRF token; an expired
        // session sends the user back to the login page instead of failing silently.
        (function () {
            var tokenMeta = document.querySelector('meta[name="_csrf"]');
            var headerMeta = document.querySelector('meta[name="_csrf_header"]');
            var token = tokenMeta ? tokenMeta.getAttribute('content') : null;
            var header = headerMeta ? headerMeta.getAttribute('content') : 'X-CSRF-TOKEN';
            var originalFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
                init = init || {};
                var url = typeof input === 'string' ? input : (input && input.url) || '';
                var method = (init.method || (input && input.method) || 'GET').toUpperCase();
                var sameOrigin = new URL(url, window.location.href).origin === window.location.origin;
                if (sameOrigin && token && ['GET', 'HEAD', 'OPTIONS'].indexOf(method) === -1) {
                    var headers = new Headers(init.headers || (input && input.headers) || {});
                    headers.set(header, token);
                    init = Object.assign({}, init, { headers: headers });
                }
                return originalFetch(input, init).then(function (response) {
                    if (sameOrigin && response.status === 401) {
                        window.location.href = '/login?expired';
                    } else if (sameOrigin && response.status === 403) {
                        response.clone().json().then(function (body) {
                            if (body && body.passwordChangeRequired) {
                                window.location.href = '/account/password';
                            }
                        }).catch(function () { });
                    }
                    return response;
                });
            };
        })();
    </script>

<body>
<div class="app-container">

    <main class="main-content" id="main-content">
        <header class="top-header">

                </button>
                <h1 class="page-title" th:text="#{${pageTitleKey}}">Dashboard</h1>
            </div>
            <div class="header-actions">
                <div class="language-switcher">
                    <a th:href="@{${currentPath}(lang='en')}"
                       th:class="${#locale.language == 'en'} ? 'lang-option active' : 'lang-option'"
                       th:text="#{lang.english}">English</a>
                    <span class="lang-separator">|</span>
                    <a th:href="@{${currentPath}(lang='ku')}"
                       th:class="${#locale.language == 'ku'} ? 'lang-option active' : 'lang-option'"
                       th:text="#{lang.kurdish}">کوردی</a>
                </div>
                <div class="connection-status" id="connection-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="connection-text" th:text="#{header.connecting}">Connecting...</span>
                </div>
                <a class="user-menu" th:href="@{/account/password}" th:title="#{account.password.change}"
                   style="text-decoration:none;color:inherit;">
                    <div class="user-avatar" th:text="${@perm.initial()}">A</div>
                    <span th:text="${@perm.displayName()}">Admin</span>
                    <i class="fas fa-key" style="font-size:10px;"></i>
                </a>
                <form th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="btn btn-sm btn-secondary">
                        <i class="fas fa-sign-out-alt"></i>
                        <span th:text="#{header.logout}">Logout</span>
                    </button>
                </form>
            </div>
        </header>
        <div class="content-area">
            <div th:replace="${sidebar}"></div>
        </div>
    </main>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    // Sidebar submenu toggle
    function toggleSubmenu(menuId, btn) {
        const menu = document.getElementById(menuId);
        if (!menu) return;

        const isExpanded = btn.getAttribute('aria-expanded') === 'true';

        if (isExpanded) {
            menu.classList.remove('show');
            btn.setAttribute('aria-expanded', 'false');
            localStorage.setItem('sidebarMenu_' + menuId, 'collapsed');
        } else {
            menu.classList.add('show');
            btn.setAttribute('aria-expanded', 'true');
            localStorage.setItem('sidebarMenu_' + menuId, 'expanded');
        }
    }

    // Restore saved submenu states
    document.addEventListener('DOMContentLoaded', function () {
        const collapsibleMenus = document.querySelectorAll('.sidebar .collapse');

        collapsibleMenus.forEach(function (menu) {
            const menuId = menu.id;
            const btn = document.querySelector('[aria-controls="' + menuId + '"]');

            if (menu && btn) {
                const savedState = localStorage.getItem('sidebarMenu_' + menuId);

                if (savedState === 'expanded') {
                    menu.classList.add('show');
                    btn.setAttribute('aria-expanded', 'true');
                } else {
                    menu.classList.remove('show');
                    btn.setAttribute('aria-expanded', 'false');
                }
            }
        });
    });
</script>
</body>
