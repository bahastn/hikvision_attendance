<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::sidebar})}">
<head><title th:text="#{page.liveView}">Live View</title></head>
<body>
<div th:fragment="sidebar">
    <div class="row">
        <div class="col-8">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-video icon-spacing"></i><span th:text="#{liveView.title}">Live Feed</span></span>
                    <div class="live-view-toolbar">
                        <span class="badge badge-present" th:text="#{liveView.live}">LIVE</span>
                        <div class="tile-size-control" th:title="#{liveView.tileSize}">
                            <i class="fas fa-compress"></i>
                            <input type="range" id="tile-size-slider" min="120" max="600" step="10" value="220"/>
                            <i class="fas fa-expand"></i>
                        </div>
                    </div>
                </div>
                <div class="card-body" style="padding:10px;">
                    <div class="camera-tiles" th:if="${!#lists.isEmpty(cameras)}">
                        <div class="camera-tile" th:each="cam : ${cameras}">
                            <img class="live-snapshot"
                                 th:attr="data-src=@{/api/cameras/{id}/snapshot(id=${cam.id})}"
                                 th:src="@{/api/cameras/{id}/snapshot(id=${cam.id})}"
                                 alt="Live camera feed"/>
                            <div class="camera-tile-label">
                                <span th:text="${cam.cameraName}">Camera</span>
                                <span class="badge badge-present" th:text="#{liveView.live}">LIVE</span>
                            </div>
                            <button type="button" class="tile-fullscreen-btn" th:title="#{liveView.fullscreen}">
                                <i class="fas fa-expand"></i>
                            </button>
                        </div>
                    </div>
                    <div class="live-feed" th:if="${#lists.isEmpty(cameras)}" style="height:300px;position:relative;background:#000;text-align:center;">
                        <div style="padding-top:120px;">
                            <i class="fas fa-video" style="font-size:48px;margin-bottom:15px;display:block;color:var(--hk-border);"></i>
                            <p th:text="#{liveView.noActiveCamera}">No active camera configured</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-4">
            <div class="card">
                <div class="card-header">
                    <span class="card-title" th:text="#{liveView.realtimeDetections}">Real-time Detections</span>
                </div>
                <div class="card-body" style="padding:0;">
                    <div id="live-detections" style="max-height:500px;overflow-y:auto;">
                        <div style="padding:20px;text-align:center;color:var(--hk-text-muted);" th:text="#{liveView.waitingDetections}">Waiting for detections...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="camera-fullscreen" class="camera-fullscreen" style="display:none;">
        <img id="fullscreen-img" class="live-snapshot" alt="Live camera feed"/>
        <div class="camera-fullscreen-topbar">
            <button type="button" id="fs-prev" class="fs-nav-btn" th:title="#{liveView.prevCamera}">
                <i class="fas fa-chevron-left"></i>
            </button>
            <select id="fs-camera-select" class="fs-camera-select"></select>
            <span id="fs-title" class="fs-title"></span>
            <span class="badge badge-present" th:text="#{liveView.live}">LIVE</span>
            <button type="button" id="fs-next" class="fs-nav-btn" th:title="#{liveView.nextCamera}">
                <i class="fas fa-chevron-right"></i>
            </button>
            <button type="button" id="fs-close" class="fs-nav-btn" th:title="#{liveView.exitFullscreen}">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>
</div>
</body>
</html>
